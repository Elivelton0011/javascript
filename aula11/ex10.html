<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Nivel de kilometragem</h1>
    Velocidade do carro: <input type="number" name="txtvel" id="txtvel">
    <input type="submit" value="Verificar" onclick="calcular()">
    <div id="res"></div>

    <script>
        function calcular() {
        var txtv = window.document.getElementById('txtvel')
        var res = window.document.getElementById('res')
        var vel = Number(txtv.value)

        res.innerHTML = `<p>Sua velocida é de <strong>${vel}</strong>Km/H</p>`
        if (vel > 60){
            res.innerHTML += 'Você ultrapassou o limite de 60km, MULTADO!'
        }
        res.innerHTML += '<p>diriga sempre com cinto de segurança</p>'
        
    
    }
        
        
      

    </script>
</body>
</html>
