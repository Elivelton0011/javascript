<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex10</title>
</head>
<body>
    <h1>sistema de multa</h1>
    sua quilometram é:
    <input type="number" name="km" id="km">
    <input type="button" value="verificar" onclick="clicou()">

    <div id="res"></div>

    <script>

        function clicou()
        {
            var txtk = document.getElementById('km')
            var vel = Number(txtk.value)
            var res = document.getElementById('res')

              res.innerText = `sua velocidade atual é ${vel}km/h\n`
            if(vel > 60){
                res.innerText += `Você ultrapasou o limite de velocidade\n`
            }
            res.innerText += " dirija com seguraça"
           
            
           

            
        }

    </script>
    
</body>
</html>
