<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex11</title>
</head>
<body>
    Seu pais de nascença: <input type="text" name="pais" id="pais">
    <input type="button" value="verificar" onclick="clicou()">
    <div id="res"></div>

    <script>
        function clicou(){

        var pais = document.getElementById('pais')
        var res = document.getElementById('res')

        if(pais.value == "brasil")
        {
            res.innerText = "Você é brasileiro"
        }
        else
        {
            res.innerText = "Você é estrangeiro"
        }
    }
        
    </script>
    

</body>
</html>
