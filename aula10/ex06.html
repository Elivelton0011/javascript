<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            margin: 0%;
            padding: 0%;
            height: 100vh;
            width: 100vw;
            justify-content: center;
            align-items: center;
        }

        #caixa {
            display: flex;
            width: 100px;
            height: 100px;
            background-color: aqua;
            align-items: center;
            justify-content: center;
            
        }
    </style>
</head>

<body>
    <div id="caixa" onclick="clicou()" onmouseout="sair()">CliCk</div>
    <script>
a = window.document.getElementById('caixa')
        function clicou() {
            a.innerText = 'Clicou!'
            a.style.background = 'yellow'
            a.style.color = 'white'
        }
        function sair() {
            a.innerText = 'CliCk'
            a.style.background = 'aqua'
            a.style.color = 'black'
        }
    </script>
</body>

</html>
