<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>açoes e funçoes</title>
</head>
<style>
    div{
        background-color: #00829f;
        width: 200px;
        height: 200px;
        color: aliceblue;
        text-align: center;
        line-height: 200px;
    }
</style>
<body>
    <div id="caixa" onclick="clicou()" onmouseenter="entrou()" onmouseout="saiu()">teste</div>

    <script>
         var a = document.getElementById('caixa')
        function clicou(){
             a.innerText = "clicou"
             a.style.background = " #00829f"
        }
        function entrou(){
            a.innerText = "entrou"
            a.style.background = "red"
        }
           function saiu(){
            a.innerText = "saiu"
            a.style.background = "yellow"
        }
    </script>
</body>
</html>
